<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA / Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aspirine" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="apple-touch-startup-image" href="/icon-512.png" />

    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#EEEAE2" />
    <meta name="application-name" content="Aspirine Clicker" />

    <!-- SEO / Social -->
    <meta name="description" content="Clique. Dissous. Répète." />

    <!-- Icônes -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <title>une aspirine. une de plus.</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        height: 100%;
        /* Respecter les encoches iOS (notch, home indicator) */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        background: #EEEAE2;
        /* Empêcher le "bounce" / overscroll iOS */
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #EEEAE2;
        /* Désactiver la sélection de texte sur mobile */
        -webkit-user-select: none;
        user-select: none;
        /* Désactiver le callout iOS (menu contextuel sur appui long) */
        -webkit-touch-callout: none;
      }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
